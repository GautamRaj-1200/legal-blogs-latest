name: Deploy Backend to Digital Ocean

on:
  push:
    branches: [stage-view]
    paths:
      - "app/**"
      - ".github/workflows/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22
            cd /home/deploy/projects/legal-blogs-latest
            git pull origin stage-view
            cd app
            pnpm install
            pnpm run build
            pm2 restart legal-blogs-api
